<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXPO RURAL 26 – ANGUS</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-title">
        <span class="site-title__number">26</span>
        <div class="site-title__text">
          <span class="site-title__expo">EXPO<strong>RURAL</strong></span>
          <span class="site-title__sub">138° EXPOSICIÓN · PALERMO</span>
        </div>
      </div>
      <nav id="categories-nav" class="categories-nav"></nav>
    </header>

    <main class="general-container">
      <div class="main-layout">
        <div id="bovino-sections" class="sections-container"></div>
      </div>
    </main>

    <!-- Lightbox -->
    <div id="flyer-lightbox">
      <div class="lightbox-backdrop"></div>
      <div class="lightbox-content">
        <button class="lightbox-close" aria-label="Cerrar">✕</button>


        <!-- Botones prev / next -->
        <button class="lb-nav-btn" id="btn-prev">&#8249;</button>
        <button class="lb-nav-btn lb-nav-btn--right" id="btn-next">&#8250;</button>

        <!-- Contenido -->
        <video id="lightbox-video" controls playsinline style="display:none"></video>
        <img id="lightbox-img" src="" alt="" style="display:none" />
        <div id="yt-player-container" style="display:none; width:100%; height:100%;">
          <div id="yt-player"></div>
        </div>
      </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
  </body>
</html>
