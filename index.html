<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXPO RURAL 26 – ANGUS</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="site-title">
        <span class="site-title__number">26</span>
        <div class="site-title__text">
          <span class="site-title__expo">EXPO<strong>RURAL</strong></span>
          <span class="site-title__sub"
            >138° EXPOSICIÓN DE GANADERÍA, AGRICULTURA E INDUSTRIA
            INTERNACIONAL</span
          >
        </div>
      </div>
      <nav id="categories-nav" class="categories-nav"></nav>
    </header>

    <main class="general-container">
      <div class="main-layout">
        <div id="bovino-sections" class="sections-container"></div>

       <div class="qrpanel-container"> <!-- Panel QR fijo a la derecha -->
        <aside class="qr-panel">
          <p class="qr-label">INGRESÁ A LA</p>
          <p class="qr-label qr-label--big">TRANSMISIÓN EN VIVO</p>
          <div class="qr-code-wrapper">
            <!-- QR generado via API pública, apunta a la imagen del QR -->
            <img
              src="https://pub-ce3793bae9b94720b5d5c8b99eba9a40.r2.dev/qr_orden_jura.jpeg"
              alt="QR Transmisión en Vivo"
              class="qr-img"
              onerror="
                this.style.display = 'none';
                document.getElementById('qr-fallback').style.display = 'flex';
              "
            />
            <div id="qr-fallback" class="qr-fallback" style="display: none">
              <span>QR no disponible</span>
            </div>
          </div>
        </aside>
        <aside class="qr-panel">
          <p class="qr-label">ESCANEÁ LA</p>
          <p class="qr-label qr-label--big">ORDEN DE JURA</p>
          <div class="qr-code-wrapper">
            <!-- QR generado via API pública, apunta a la imagen del QR -->
            <img
              src="https://pub-ce3793bae9b94720b5d5c8b99eba9a40.r2.dev/qr_orden_jura2.png"
              alt="QR Orden de Jura"
              class="qr-img"
              onerror="
                this.style.display = 'none';
                document.getElementById('qr-fallback').style.display = 'flex';
              "
            />
            <div id="qr-fallback" class="qr-fallback" style="display: none">
              <span>QR no disponible</span>
            </div>
          </div>
        </aside>
        </div>
      </div>
    </main>

    <!-- Lightbox -->
    <div id="flyer-lightbox">
      <div class="lightbox-backdrop"></div>
      <div class="lightbox-content">
        <button class="lightbox-close" aria-label="Cerrar">✕</button>
        <video
          id="lightbox-video"
          controls
          autoplay
          playsinline
          style="display: none"
        ></video>
        <img id="lightbox-img" src="" alt="" style="display: none" />
        <iframe
          id="lightbox-iframe"
          src=""
          frameborder="0"
          allowfullscreen
          allow="autoplay; encrypted-media"
          style="display: none; width: 100vw; height: 100vh"
        ></iframe>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
